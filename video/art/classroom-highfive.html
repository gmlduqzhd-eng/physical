<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>하이파이브</title>
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="art.css">
<script src="kit.js"></script></head>
<body><div id="stage"></div>
<script>
// 수업 끝: 짝끼리 하이파이브, 땀 닦기. 3.5초 주기(14초에 4번) → 끊김 없는 반복
const A=ART, C=A.C, el=A.el, TV=A.TV, svg=A.svg();
const room=A.classroom(svg,{rain:false,tvOn:true});
// TV: 수업 완료 화면(이 장면은 합성 덮개 없음)
const fin=el('g',{},room.screenOn);
el('rect',{x:TV.x,y:TV.y,width:TV.w,height:TV.h,fill:C.tint},fin);
el('circle',{cx:TV.x+TV.w/2,cy:TV.y+TV.h*0.44,r:96,fill:C.forest},fin);
el('path',{d:`M${TV.x+TV.w/2-42} ${TV.y+TV.h*0.44+2} l30 30 l56 -60`,fill:'none',stroke:C.paper,'stroke-width':20,'stroke-linecap':'round','stroke-linejoin':'round'},fin);
for(let i=0;i<3;i++) el('path',{d:'M0 -30 C14 -10 22 2 22 14 A22 22 0 0 1 -22 14 C-22 2 -14 -10 0 -30 Z',fill:i===1?C.amber:C.forest,transform:`translate(${TV.x+TV.w/2+(i-1)*76} ${TV.y+TV.h*0.8})`},fin);
const T=A.teacherSide(room.mid,{x:1770,y:880,s:.78,skin:A.SKIN[1],top:'#7e8e9b',hair:A.HAIR[0]});
const kids=A.seatKids(room);
const P=3.5;
// 하이파이브 불꽃
function spark(){ const g=el('g',{opacity:0},room.top);
  for(let i=0;i<8;i++){ const a=i*45; el('line',{x1:0,y1:-34,x2:0,y2:-56,stroke:C.amber,'stroke-width':8,'stroke-linecap':'round',transform:`rotate(${a})`},g); }
  return g; }
const pairs=[{a:5,b:6,off:0.0,sp:spark()},{a:7,b:8,off:1.75,sp:spark()}];
const drops=kids.map(k=>A.sweatDrop(k.fx));
A.onFrame(t=>{
  const pose=kids.map((k,i)=>({sit:0,la:8,ra:8,le:4,re:4,tilt:A.wave(t,3.5,i*.2)*3,lean:A.wave(t,7,i*.13)*1.5}));
  // 뒷줄: 0 기지개, 1·3 땀 닦기, 2 허리에 손, 4 팔 흔들기
  const st=(Math.sin(2*Math.PI*t/7)+1)/2;
  Object.assign(pose[0],{la:8+A.smooth(st)*150,ra:8+A.smooth(st)*150});
  Object.assign(pose[2],{la:38,ra:38,le:-82,re:-82});
  Object.assign(pose[4],{ra:150+Math.sin(2*Math.PI*t/0.875)*14,re:-6});
  for (const [i,off] of [[1,0.6],[3,2.3]]){
    const u=((t-off)%P+P)%P;
    const w=A.smooth(A.span(u,0,0.4))*(1-A.smooth(A.span(u,1.6,2.0)));
    const rub=Math.sin(2*Math.PI*u/0.5)*10*w;
    Object.assign(pose[i],{ra:A.lerp(8,112+rub,w),re:A.lerp(4,138,w),tilt:-6*w});
    const q=A.clamp((u-1.7)/0.6);
    drops[i].setAttribute('opacity', u>1.7&&u<2.3?Math.sin(Math.PI*q):0);
    drops[i].setAttribute('transform',`translate(${80+q*70} ${-300+q*q*120-q*40}) scale(1.3)`);
  }
  for(const p of pairs){
    const u=((t-p.off)%P+P)%P;
    const up=A.easeOut(A.span(u,0.15,0.55))*(1-A.easeInOut(A.span(u,1.0,1.45)));
    const hit=A.span(u,0.5,0.62)*(1-A.span(u,0.62,0.8));
    const hop=Math.sin(Math.PI*A.span(u,0.45,0.85))*16;
    Object.assign(pose[p.a],{ra:A.lerp(8,136,up),re:A.lerp(4,-2,up),lift:hop,tilt:6*up,lean:2*up});
    Object.assign(pose[p.b],{la:A.lerp(8,136,up),le:A.lerp(4,-2,up),lift:hop,tilt:-6*up,lean:-2*up});
    const ka=kids[p.a], kb=kids[p.b];
    const cx=(ka.x+kb.x)/2, cy=ka.y-150-112-hop;
    const sv=A.span(u,0.52,0.95);
    p.sp.setAttribute('opacity', u>0.52&&u<0.95?1-sv:0);
    p.sp.setAttribute('transform',`translate(${cx} ${cy}) scale(${0.7+sv*0.6})`);
  }
  kids.forEach((k,i)=>k.set(pose[i]));
  // 선생님: 박수
  const c=Math.abs(Math.sin(2*Math.PI*t/0.875));
  T.set({fa:70, fe:30+c*20, ba:60, be:40+c*20, tilt:-4});
});
</script></body></html>
