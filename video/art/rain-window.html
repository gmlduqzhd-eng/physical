<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>비 오는 창밖</title>
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="art.css">
<script src="kit.js"></script></head>
<body><div id="stage"></div>
<script>
// 교실 창문 너머 비 내리는 운동장. 창턱 위에는 쓰지 못한 공. 모든 주기는 14초에 맞춤(끊김 없는 반복)
const A=ART, C=A.C, el=A.el, svg=A.svg();
el('rect',{x:0,y:0,width:1920,height:1080,fill:C.wall},svg);
const WX=250, WY=90, WW=1420, WH=760;
// 바깥
const cp=el('clipPath',{id:'win'},svg); el('rect',{x:WX,y:WY,width:WW,height:WH,rx:10},cp);
const out=el('g',{'clip-path':'url(#win)'},svg);
el('rect',{x:WX,y:WY,width:WW,height:WH,fill:'#cdd5cf'},out);
// 먼 산과 건물
el('path',{d:`M${WX} ${WY+420} Q${WX+260} ${WY+330} ${WX+520} ${WY+400} T${WX+1000} ${WY+380} T${WX+WW} ${WY+390} V${WY+WH} H${WX} Z`,fill:'#bcc6bd'},out);
el('rect',{x:WX+880,y:WY+300,width:330,height:170,rx:8,fill:'#c3cbc4'},out);
for(let i=0;i<5;i++) el('rect',{x:WX+905+i*62,y:WY+330,width:36,height:44,rx:4,fill:'#b2bcb3'},out);
// 나무
const trees=[[WX+120,WY+430,110],[WX+300,WY+455,80],[WX+1280,WY+430,120],[WX+1150,WY+470,70]];
for(const [x,y,r] of trees){ el('rect',{x:x-9,y:y,width:18,height:110,fill:'#8e9a8c'},out); el('circle',{cx:x,cy:y,r,fill:'#a2b0a0'},out); }
// 운동장
el('rect',{x:WX,y:WY+520,width:WW,height:WH-520,fill:'#b9b9a6'},out);
el('ellipse',{cx:WX+WW/2,cy:WY+640,rx:520,ry:70,fill:'none',stroke:'#cfcfbf','stroke-width':6},out);
// 축구 골대
el('path',{d:`M${WX+980} ${WY+600} V${WY+500} H${WX+1220} V${WY+600}`,fill:'none',stroke:'#eef0ea','stroke-width':9,'stroke-linejoin':'round'},out);
el('path',{d:`M${WX+980} ${WY+500} L${WX+1010} ${WY+540} H${WX+1190} L${WX+1220} ${WY+500}`,fill:'none',stroke:'#dfe3dc','stroke-width':4},out);
// 웅덩이와 물결
const pud=[[WX+380,WY+660,150,22],[WX+760,WY+700,110,16],[WX+1180,WY+690,130,18]];
const rings=[];
for(const [x,y,rx,ry] of pud){ el('ellipse',{cx:x,cy:y,rx,ry,fill:'#c9d0c8'},out);
  for(let j=0;j<3;j++) rings.push({x:x+(j-1)*rx*0.45,y,rx:rx*0.35,ry:ry*0.35,ph:(j*0.37+x*0.001)%1,e:el('ellipse',{fill:'none',stroke:'#eef1ec','stroke-width':3},out)}); }
// 비 두 겹(먼 비는 가늘게)
const far=A.rainGroup(out,WX,WY,WW,WH,120,3,{color:'#eef1ec',sw:2,minLen:18,maxLen:34,oMin:.35,oMax:.7,kMin:14,kMax:18});
const near=A.rainGroup(out,WX,WY,WW,WH,60,5,{color:'#f8faf6',sw:3.5,minLen:46,maxLen:80,oMin:.55,oMax:.9,kMin:18,kMax:24});
// 유리창 물방울(흘러내림)
const glass=el('g',{'clip-path':'url(#win)'},svg);
const r=A.rng(21), beads=[];
for(let i=0;i<70;i++){ const x=WX+r()*WW, y=WY+r()*WH, s=3+r()*6; el('ellipse',{cx:x,cy:y,rx:s*0.8,ry:s,fill:'#ffffff',opacity:.45},glass); }
for(let i=0;i<9;i++){ beads.push({x:WX+60+r()*(WW-120),y0:WY+r()*200,len:300+r()*360,ph:r(),k:1+Math.floor(r()*2),
  trail:el('path',{fill:'none',stroke:'#ffffff','stroke-width':5,'stroke-linecap':'round',opacity:.35},glass),
  d:el('ellipse',{rx:8,ry:10,fill:'#ffffff',opacity:.75},glass)}); }
// 창틀
el('rect',{x:WX-26,y:WY-26,width:WW+52,height:WH+52,rx:24,fill:'none',stroke:C.paper,'stroke-width':52},svg);
el('rect',{x:WX-52,y:WY-52,width:WW+104,height:WH+104,rx:30,fill:'none',stroke:C.line,'stroke-width':4},svg);
el('rect',{x:WX+WW/2-12,y:WY,width:24,height:WH,fill:C.paper},svg);
el('rect',{x:WX,y:WY+WH*0.42-10,width:WW,height:20,fill:C.paper},svg);
el('rect',{x:WX+WW/2-26,y:WY+WH*0.42+30,width:10,height:60,rx:5,fill:C.line},svg);
// 창턱
el('rect',{x:WX-110,y:WY+WH+20,width:WW+220,height:44,rx:14,fill:C.paper,stroke:C.line,'stroke-width':4},svg);
el('rect',{x:0,y:WY+WH+64,width:1920,height:1080,fill:C.wainscot},svg);
el('rect',{x:0,y:WY+WH+64,width:1920,height:8,fill:C.line},svg);
// 창턱 위: 화분, 공, 운동화
const pot=el('g',{transform:`translate(${WX+120} ${WY+WH+20})`},svg);
for (const [dx,dy,rx,ry,rot] of [[0,-150,22,56,-8],[-30,-120,18,46,-40],[30,-126,18,48,34],[-8,-96,16,38,-70],[14,-100,16,38,64]])
  el('ellipse',{cx:dx,cy:dy,rx,ry,transform:`rotate(${rot} ${dx} ${dy})`,fill:C.forest},pot);
el('path',{d:'M-56 0 L-44 -86 H44 L56 0 Z',fill:C.woodDark},pot);
el('rect',{x:-50,y:-96,width:100,height:18,rx:6,fill:C.wood},pot);
const ball=el('g',{},svg);
el('circle',{cx:0,cy:0,r:74,fill:C.paper,stroke:C.ink,'stroke-width':5},ball);
el('path',{d:'M0 -24 L23 -7 L14 20 L-14 20 L-23 -7 Z',fill:C.ink},ball);
for(const a of [0,72,144,216,288]){ el('path',{d:'M0 -24 L0 -56',stroke:C.ink,'stroke-width':5,transform:`rotate(${a})`},ball);
  el('path',{d:'M-18 -66 L0 -56 L18 -66',fill:'none',stroke:C.ink,'stroke-width':5,'stroke-linejoin':'round',transform:`rotate(${a})`},ball); }
el('rect',{x:WX+WW-330,y:WY+WH-2,width:200,height:22,rx:8,fill:C.forest,opacity:.0},svg);
// 운동화 한 켤레
const shoe=(x)=>{ const g=el('g',{transform:`translate(${x} ${WY+WH+20})`},svg);
  el('path',{d:'M-70 0 V-38 Q-70 -60 -46 -60 L-6 -60 Q6 -40 30 -36 L58 -30 Q76 -26 76 -10 V0 Z',fill:C.forest},g);
  el('rect',{x:-74,y:-12,width:154,height:14,rx:7,fill:C.paper,stroke:C.line,'stroke-width':3},g);
  el('path',{d:'M-40 -54 L-20 -38 M-28 -58 L-8 -42',stroke:C.paper,'stroke-width':5,'stroke-linecap':'round'},g); return g; };
shoe(WX+WW-300); shoe(WX+WW-140);
A.onFrame(t=>{
  far.render(t); near.render(t);
  for(const g of rings){ const q=((t/14)*8+g.ph)%1; g.e.setAttribute('cx',g.x); g.e.setAttribute('cy',g.y);
    g.e.setAttribute('rx',g.rx*(0.3+q*1.4)); g.e.setAttribute('ry',g.ry*(0.3+q*1.4)); g.e.setAttribute('opacity',(1-q)*0.9); }
  for(const b of beads){ const q=((t/14)*b.k+b.ph)%1; const y=b.y0+A.easeInOut(q)*b.len; const wob=Math.sin(q*9)*6;
    const fade=q<0.08?q/0.08:(q>0.85?(1-q)/0.15:1);
    b.d.setAttribute('cx',b.x+wob); b.d.setAttribute('cy',y); b.d.setAttribute('opacity',0.75*fade);
    const ys=Math.max(b.y0,y-160); b.trail.setAttribute('d',`M${b.x+Math.sin(((ys-b.y0)/b.len)*9)*6} ${ys} Q${b.x+wob*0.7} ${(ys+y)/2} ${b.x+wob} ${y-10}`); b.trail.setAttribute('opacity',0.3*fade); }
  ball.setAttribute('transform',`translate(${WX+WW/2+40} ${WY+WH+20-74})`);
});
</script></body></html>
