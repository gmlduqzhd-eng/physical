<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0891b2" />
    <meta name="description" content="땀방울 원정대 - 초등 2022 개정 체육과 스마트 체육 미니게임 플랫폼" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- 카카오톡 및 모바일 메타 태그 (Open Graph) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="땀방울 원정대" />
    <meta property="og:description" content="초등 2022 개정 체육과 3대 영역(운동 · 스포츠 · 표현) 스마트 체육 미니게임 플랫폼" />
    <meta property="og:image" content="/favicon.svg" />
    <meta property="og:site_name" content="땀방울 원정대" />

    <!-- 카카오톡 인앱 브라우저 탈출 (외부 브라우저 호출) 최우선 실행 스크립트 -->
    <script>
      (function() {
        var ua = navigator.userAgent || navigator.vendor || (window.opera ? window.opera.toString() : '');
        var isKakao = /KAKAOTALK/i.test(ua);
        
        if (isKakao) {
          var currentUrl = location.href;
          // 무한 리다이렉트 방지 플래그 확인
          var hasEscaped = false;
          try {
            hasEscaped = sessionStorage.getItem('kakao_open_ext_done') === '1';
          } catch(e) {}

          if (!hasEscaped) {
            try {
              sessionStorage.setItem('kakao_open_ext_done', '1');
            } catch(e) {}

            var isAndroid = /Android/i.test(ua);
            if (isAndroid) {
              // 안드로이드 카카오톡 외부 브라우저(크롬) 호출
              location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(currentUrl);
            } else {
              // iOS 카카오톡 외부 브라우저(사파리) 호출
              location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(currentUrl);
            }
          }
        }
      })();
    </script>

    <link rel="manifest" href="/manifest.json" />
    <title>땀방울 원정대</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        var ua = navigator.userAgent || navigator.vendor || (window.opera ? window.opera.toString() : '');
        var isKakao = /KAKAOTALK/i.test(ua);

        if ('serviceWorker' in navigator) {
          if (isKakao) {
            // 카카오톡 웹뷰에서는 캐시 충돌 방지를 위해 기존 서비스워커 해제
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (var i = 0; i < registrations.length; i++) {
                registrations[i].unregister();
              }
            }).catch(function() {});
          } else {
            window.addEventListener('load', function() {
              navigator.serviceWorker.register('/sw.js').catch(function() {});
            });
          }
        }
      })();
    </script>
  </body>
</html>
